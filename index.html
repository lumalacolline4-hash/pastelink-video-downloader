<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pastelink - Video Downloader</title>
  <meta name="description" content="Download videos directly to device storage from YouTube, TikTok, Instagram, Twitter/X, Reddit, Facebook, Vimeo, and direct media links.">
  <meta property="og:title" content="Pastelink - Video Downloader">
  <meta property="og:description" content="Download videos directly to device storage from YouTube, TikTok, Instagram, Twitter/X, Reddit, Facebook, Vimeo, and direct media links.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    // Prevent benign Vite dev WebSocket HMR errors from bubbling up in sandboxed preview
    window.addEventListener('error', function(e) {
      if (e && (e.message?.includes('WebSocket') || e.filename?.includes('@vite/client') || e.message?.includes('createWebSocketModuleRunnerTransport'))) {
        e.stopImmediatePropagation();
        e.preventDefault();
      }
    }, true);
    window.addEventListener('unhandledrejection', function(e) {
      const reason = String(e?.reason || '');
      if (reason.includes('WebSocket') || reason.includes('@vite/client') || reason.includes('createWebSocketModuleRunnerTransport')) {
        e.stopImmediatePropagation();
        e.preventDefault();
      }
    }, true);
  </script>
</head>
<body class="bg-white text-zinc-900 antialiased min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
